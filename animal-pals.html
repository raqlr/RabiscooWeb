<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe the Bear &amp; Friends — Rabiscoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/animal-pals.css">
<script src="js/animal-pals.js" defer></script>

<body>
<header class="site-header"><a class="brand" href="Rabiscoo.html"><img src="Images/logo.png" alt="Rabiscoo"></a></header>
<main>
<div class="intro"><h1>Joe the Bear <span>&amp; Friends</span></h1></div>
<section class="picture-wall" id="picture-wall" aria-label="Animal Pals picture wall">
<button class="picture" type="button" data-id="garden" aria-label="Move Fluffy and Susie’s garden picture" style="--tilt:-4deg"><img src="Images/Frame.png" alt="Fluffy the sheep and Susie the giraffe drawing in a garden" draggable="false"></button>
<button class="picture" type="button" data-id="together" aria-label="Move the friends’ group picture" style="--tilt:2deg"><img src="Images/AllFrame.png" alt="All our animal friends together in a decorative frame" draggable="false"></button>
<button class="picture" type="button" data-id="three" aria-label="Move the three friends’ picture" style="--tilt:-2deg"><img src="Images/ThreeFrame.png" alt="Three animal friends in a decorative frame" draggable="false"></button>
<button class="picture" type="button" data-id="bunny" aria-label="Move Bunny and Koko’s picture" style="--tilt:3deg"><img src="Images/Bunny&amp;KokoFrame.png" alt="Bunny and Koko in a decorative frame" draggable="false"></button>
<button class="picture" type="button" data-id="joe" aria-label="Move Lea and Joe’s picture" style="--tilt:-3deg"><img src="Images/Lea-BearFrame.png" alt="Lea and Joe the Bear in a decorative frame" draggable="false"></button>
</section>
<p class="sr-only" role="status" id="wall-status"></p>
</main>
<footer class="page-footer"><a class="back-link" href="Rabiscoo.html">← Back to our adventure</a></footer>
